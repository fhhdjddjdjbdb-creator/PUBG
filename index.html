<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin"><title>البث المباشر</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070709;color:#fff;font-family:Arial,Tahoma,sans-serif}
header{padding:20px 16px;text-align:center;background:linear-gradient(135deg,#180507,#3d080d);border-bottom:1px solid #5a1018}
h1{margin:0}.sub{color:#d9bfc2;margin-top:7px;font-size:13px}main{max-width:1100px;margin:auto;padding:20px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.card{background:#12080a;border:1px solid #3d080d;border-radius:18px;overflow:hidden}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#23080b}.body{padding:14px}.name{font-size:18px;font-weight:bold;margin:9px 0 12px}
.live{display:inline-block;background:#b00016;border-radius:50px;padding:4px 9px;font-size:11px}.watch{width:100%;border:0;border-radius:12px;padding:13px;background:#e0001b;color:#fff;font-weight:bold;cursor:pointer}
.empty{text-align:center;padding:70px 20px;color:#92777b;border:1px dashed #5a1018;border-radius:18px}
#modal{display:none;position:fixed;inset:0;background:#000f;z-index:100;align-items:center;justify-content:center}
.playerBox{width:min(1100px,96vw);background:#0b0b0d;border:1px solid #3d080d;border-radius:18px;overflow:hidden}
.playerTop{height:55px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#12080a}
.closeBtn,.controlBtn{border:0;background:#3d080d;color:#fff;border-radius:10px;cursor:pointer}.closeBtn{padding:9px 13px}
.videoWrap{position:relative;background:#000;width:100%;aspect-ratio:16/9}.videoWrap video,.videoWrap iframe{width:100%;height:100%;display:block;border:0;background:#000}
.controls{display:flex;align-items:center;gap:8px;padding:10px;background:#12080a}.controlBtn{min-width:42px;height:38px;font-size:17px}
.status{flex:1;color:#d9bfc2;font-size:12px;text-align:center}.hint{padding:0 12px 12px;color:#92777b;font-size:12px;text-align:center}
@media(max-width:650px){.grid{grid-template-columns:1fr 1fr;gap:10px}.body{padding:9px}.name{font-size:14px}.watch{padding:10px;font-size:13px}.playerBox{width:100vw;border:0;border-radius:0}}
@media(orientation:landscape) and (max-height:600px){#modal{background:#000}.playerBox{width:100vw;height:100vh;border:0;border-radius:0;display:flex;flex-direction:column}.playerTop{display:none}.videoWrap{flex:1;aspect-ratio:auto}.controls{height:52px}.hint{display:none}}
</style></head><body>
<header><h1>📺 البث المباشر</h1><div class="sub">مشاهدة مباشرة من داخل الموقع</div></header>
<main><div id="grid" class="grid"></div><div id="empty" class="empty" style="display:none">لا توجد بثوث متاحة حاليًا.</div></main>
<div id="modal"><div class="playerBox">
<div class="playerTop"><b id="title">البث المباشر</b><button id="close" class="closeBtn">✕ إغلاق</button></div>
<div id="videoWrap" class="videoWrap"></div>
<div class="controls"><button id="playBtn" class="controlBtn">▶</button><button id="muteBtn" class="controlBtn">🔊</button><button id="fullBtn" class="controlBtn">⛶</button><div id="status" class="status">جاهز للمشاهدة</div></div>
<div class="hint">روابط YouTube يجب أن تسمح بالتضمين. المشغل يظل داخل موقعك.</div>
</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA2k-wSnJ3UjSNSv1amcodfjSNJthu_P6Y",
  authDomain: "mohmed-e9bc6.firebaseapp.com",
  databaseURL: "https://mohmed-e9bc6-default-rtdb.firebaseio.com",
  projectId: "mohmed-e9bc6",
  storageBucket: "mohmed-e9bc6.firebasestorage.app",
  appId: "1:356929992041:android:5b6b56c609e97b2bf839f8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const grid=document.getElementById("grid"),empty=document.getElementById("empty"),modal=document.getElementById("modal"),wrap=document.getElementById("videoWrap"),title=document.getElementById("title"),status=document.getElementById("status");
let hls=null,currentType=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function youtubeId(url){try{const u=new URL(url);if(u.hostname.includes("youtu.be"))return u.pathname.slice(1).split("/")[0];if(u.hostname.includes("youtube.com")){if(u.pathname==="/watch")return u.searchParams.get("v");if(u.pathname.startsWith("/live/"))return u.pathname.split("/")[2];if(u.pathname.startsWith("/shorts/"))return u.pathname.split("/")[2];if(u.pathname.startsWith("/embed/"))return u.pathname.split("/")[2]}}catch(e){}return null}
function openPlayer(item){
 title.textContent=item.name||"البث المباشر";modal.style.display="flex";document.body.style.overflow="hidden";wrap.innerHTML="";status.textContent="جاري التحميل...";
 currentType=item.type||"hls";
 if(currentType==="youtube"){
  const id=youtubeId(item.streamUrl);if(!id){status.textContent="رابط YouTube غير صحيح";return}
  const iframe=document.createElement("iframe");
  iframe.allow="autoplay; encrypted-media; fullscreen; picture-in-picture";
  iframe.allowFullscreen=true;
  iframe.referrerPolicy="strict-origin-when-cross-origin";
  const siteOrigin = window.location.origin;
  const params = new URLSearchParams({
    autoplay:"1",
    playsinline:"1",
    rel:"0",
    enablejsapi:"1"
  });
  if (siteOrigin && siteOrigin !== "null" && siteOrigin.startsWith("http")) {
    params.set("origin", siteOrigin);
    params.set("widget_referrer", siteOrigin);
  }
  iframe.src="https://www.youtube.com/embed/"+encodeURIComponent(id)+"?"+params.toString();
  wrap.appendChild(iframe);
  document.getElementById("playBtn").style.display="none";document.getElementById("muteBtn").style.display="none";status.textContent="YouTube — التشغيل داخل الموقع";
 }else{
  document.getElementById("playBtn").style.display="block";document.getElementById("muteBtn").style.display="block";
  const video=document.createElement("video");video.controls=false;video.playsInline=true;video.setAttribute("playsinline","");wrap.appendChild(video);
  if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:true,maxBufferLength:8});hls.loadSource(item.streamUrl);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));}
  else if(video.canPlayType("application/vnd.apple.mpegurl")){video.src=item.streamUrl;video.play().catch(()=>{})}
  else status.textContent="المتصفح لا يدعم HLS";
  document.getElementById("playBtn").onclick=()=>video.paused?video.play():video.pause();
  document.getElementById("muteBtn").onclick=()=>{video.muted=!video.muted;document.getElementById("muteBtn").textContent=video.muted?"🔇":"🔊"};
  status.textContent="البث يعمل داخل الموقع";
 }
}
function closePlayer(){if(hls){hls.destroy();hls=null}modal.style.display="none";document.body.style.overflow="";wrap.innerHTML="";document.getElementById("playBtn").style.display="block";document.getElementById("muteBtn").style.display="block"}
document.getElementById("close").onclick=closePlayer;modal.onclick=e=>{if(e.target===modal)closePlayer()};
document.getElementById("fullBtn").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else wrap.requestFullscreen?.().catch(()=>{})};
db.ref("streams").on("value",snap=>{const d=snap.val()||{},a=Object.entries(d).map(([id,v])=>({id,...v})).filter(x=>x.enabled!==false);a.sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));grid.innerHTML="";empty.style.display=a.length?"none":"block";a.forEach(x=>{const c=document.createElement("div");c.className="card";c.innerHTML=`<img class="thumb" src="${esc(x.image)}" alt=""><div class="body"><span class="live">● متاح الآن</span><div class="name">${esc(x.name)}</div><button class="watch">▶ شاهد الآن</button></div>`;c.querySelector(".watch").onclick=()=>openPlayer(x);grid.appendChild(c)})});
</script></body></html>
