<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin"><title>البث المباشر</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070709;color:#fff;font-family:Arial,Tahoma,sans-serif}
header{padding:20px 16px;text-align:center;background:linear-gradient(135deg,#180507,#3d080d);border-bottom:1px solid #5a1018}
h1{margin:0}.sub{color:#d9bfc2;margin-top:7px;font-size:13px}
main{max-width:1100px;margin:auto;padding:20px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:#12080a;border:1px solid #3d080d;border-radius:18px;overflow:hidden}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#23080b}.body{padding:14px}
.name{font-size:18px;font-weight:bold;margin:9px 0 12px}.live{display:inline-block;background:#b00016;border-radius:50px;padding:4px 9px;font-size:11px}
.watch{width:100%;border:0;border-radius:12px;padding:13px;background:#e0001b;color:#fff;font-weight:bold;cursor:pointer}
.empty{text-align:center;padding:70px 20px;color:#92777b;border:1px dashed #5a1018;border-radius:18px}

#modal{display:none;position:fixed;inset:0;background:#000f;z-index:100;align-items:center;justify-content:center;padding:10px}
.playerBox{width:min(1200px,98vw);background:#070707;border:1px solid #301015;border-radius:20px;overflow:hidden;box-shadow:0 20px 70px #000}
.playerTop{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#14070a}
.closeBtn{border:0;background:#5b0710;color:#fff;border-radius:12px;padding:10px 15px;font-size:14px;cursor:pointer}
.title{font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:10px}
.playerShell{position:relative;background:#000;width:100%;aspect-ratio:16/9;overflow:hidden}
.playerShell video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;cursor:pointer}
.bigPlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50%;border:0;background:#fff;color:#111;font-size:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:4;box-shadow:0 8px 30px #0008}
.bigPlay.hidden{display:none}
.playerOverlay{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 10px;background:linear-gradient(transparent,#000c);z-index:5}
.progress{height:5px;background:#ffffff45;border-radius:9px;cursor:pointer;margin:0 4px 10px;position:relative}
.progressFill{height:100%;width:0;background:#e0001b;border-radius:9px;pointer-events:none}
.controls{display:flex;align-items:center;gap:8px}
.control{width:42px;height:40px;border:0;border-radius:11px;background:#ffffff1c;color:#fff;cursor:pointer;font-size:18px}
.control:hover{background:#ffffff2d}.time{font-size:12px;min-width:88px;text-align:center;color:#eee}
.volume{width:95px;accent-color:#e0001b}
.spacer{flex:1}
.quality{background:#ffffff1c;color:#fff;border:0;border-radius:9px;padding:9px;cursor:pointer}
.status{padding:9px 12px;background:#12080a;color:#d9bfc2;font-size:12px;text-align:center}
.youtubeFrame{position:absolute;inset:0;width:100%;height:100%;border:0}
.youtubeNote{padding:9px 12px;background:#12080a;color:#92777b;font-size:12px;text-align:center}
@media(max-width:650px){
 .grid{grid-template-columns:1fr 1fr;gap:10px}.body{padding:9px}.name{font-size:14px}.watch{padding:10px;font-size:13px}
 #modal{padding:0}.playerBox{width:100vw;border:0;border-radius:0}.playerTop{height:52px}.title{font-size:15px}
 .volume{width:65px}.time{min-width:70px}.control{width:39px;height:38px}
}
@media(orientation:landscape) and (max-height:600px){
 #modal{padding:0;background:#000}.playerBox{width:100vw;height:100vh;border:0;border-radius:0;display:flex;flex-direction:column}
 .playerTop{display:none}.playerShell{flex:1;aspect-ratio:auto;height:auto}.status,.youtubeNote{display:none}
}
.playerBox:fullscreen{width:100vw;height:100vh;border:0;border-radius:0}
.playerBox:fullscreen .playerShell{height:calc(100vh - 58px);aspect-ratio:auto}
.playerBox:fullscreen .playerTop{height:58px}
@media(orientation:landscape) and (max-height:600px){
 .playerBox:fullscreen .playerTop{display:none}.playerBox:fullscreen .playerShell{height:100vh}
}
</style></head><body>
<header><h1>📺 البث المباشر</h1><div class="sub">مشاهدة مباشرة من داخل الموقع</div></header>
<main><div id="grid" class="grid"></div><div id="empty" class="empty" style="display:none">لا توجد بثوث متاحة حاليًا.</div></main>
<div id="modal"><div class="playerBox" id="playerBox">
<div class="playerTop"><div id="title" class="title">البث المباشر</div><button id="close" class="closeBtn">✕ إغلاق</button></div>
<div id="playerShell" class="playerShell"></div>
<div id="status" class="status">جاهز للمشاهدة</div>
</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA2k-wSnJ3UjSNSv1amcodfjSNJthu_P6Y",
  authDomain: "mohmed-e9bc6.firebaseapp.com",
  databaseURL: "https://mohmed-e9bc6-default-rtdb.firebaseio.com",
  projectId: "mohmed-e9bc6",
  storageBucket: "mohmed-e9bc6.firebasestorage.app",
  appId: "1:356929992041:android:5b6b56c609e97b2bf839f8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const grid=document.getElementById("grid"),empty=document.getElementById("empty"),
modal=document.getElementById("modal"),shell=document.getElementById("playerShell"),
playerBox=document.getElementById("playerBox"),title=document.getElementById("title"),
status=document.getElementById("status");
let hls=null,video=null,raf=0;

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function youtubeId(url){
 try{
  const u=new URL(url);
  if(u.hostname.includes("youtu.be")) return u.pathname.slice(1).split("/")[0];
  if(u.hostname.includes("youtube.com")){
   if(u.pathname==="/watch") return u.searchParams.get("v");
   if(u.pathname.startsWith("/live/")) return u.pathname.split("/")[2];
   if(u.pathname.startsWith("/shorts/")) return u.pathname.split("/")[2];
   if(u.pathname.startsWith("/embed/")) return u.pathname.split("/")[2];
  }
 }catch(e){}
 return null;
}
function fmt(sec){
 if(!Number.isFinite(sec)) return "00:00";
 sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
 return h?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function destroyHls(){if(hls){hls.destroy();hls=null}cancelAnimationFrame(raf)}
function buildControls(){
 shell.insertAdjacentHTML("beforeend",`
 <button id="bigPlay" class="bigPlay" aria-label="تشغيل">▶</button>
 <div class="playerOverlay">
  <div id="progress" class="progress"><div id="progressFill" class="progressFill"></div></div>
  <div class="controls">
   <button id="play" class="control">▶</button>
   <button id="mute" class="control">🔊</button>
   <input id="volume" class="volume" type="range" min="0" max="1" step=".01" value="1">
   <span id="time" class="time">00:00 / 00:00</span>
   <span class="spacer"></span>
   <button id="live" class="quality" style="display:none">● LIVE</button>
   <button id="fs" class="control" aria-label="ملء الشاشة">⛶</button>
  </div>
 </div>`);
}
function setPlayIcon(){
 const p=document.getElementById("play"),b=document.getElementById("bigPlay");
 if(!video)return;
 const paused=video.paused;
 p.textContent=paused?"▶":"⏸"; b.classList.toggle("hidden",!paused);
}
function updateProgress(){
 if(!video)return;
 const dur=video.duration,cur=video.currentTime||0;
 document.getElementById("time").textContent=`${fmt(cur)} / ${fmt(dur)}`;
 const fill=document.getElementById("progressFill");
 if(Number.isFinite(dur)&&dur>0) fill.style.width=(cur/dur*100)+"%";
 else fill.style.width="100%";
 raf=requestAnimationFrame(updateProgress);
}
function bindControls(){
 const play=()=>video.paused?video.play().catch(()=>{}):video.pause();
 document.getElementById("play").onclick=play;
 document.getElementById("bigPlay").onclick=play;
 video.addEventListener("play",setPlayIcon);video.addEventListener("pause",setPlayIcon);
 video.addEventListener("loadedmetadata",()=>{status.textContent="جاهز للمشاهدة"});
 video.addEventListener("playing",()=>{status.textContent="البث يعمل الآن";setPlayIcon()});
 video.addEventListener("waiting",()=>status.textContent="جاري تحميل البث...");
 video.addEventListener("error",()=>status.textContent="تعذر تشغيل رابط HLS");
 document.getElementById("mute").onclick=()=>{video.muted=!video.muted;document.getElementById("mute").textContent=video.muted?"🔇":"🔊"};
 document.getElementById("volume").oninput=e=>{video.volume=Number(e.target.value);video.muted=video.volume===0;document.getElementById("mute").textContent=video.muted?"🔇":"🔊"};
 document.getElementById("progress").onclick=e=>{
  if(!Number.isFinite(video.duration)||video.duration<=0)return;
  const r=e.currentTarget.getBoundingClientRect(),x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  video.currentTime=x*video.duration;
 };
 document.getElementById("fs").onclick=async()=>{
  try{
   if(!document.fullscreenElement) await playerBox.requestFullscreen();
   else await document.exitFullscreen();
   try{if(screen.orientation?.lock)await screen.orientation.lock("landscape")}catch(e){}
  }catch(e){}
 };
 updateProgress();
}
function openHls(item){
 video=document.createElement("video");
 video.playsInline=true;video.setAttribute("playsinline","");video.preload="auto";video.crossOrigin="anonymous";
 shell.appendChild(video);buildControls();bindControls();
 if(window.Hls&&Hls.isSupported()){
  hls=new Hls({enableWorker:true,lowLatencyMode:true,maxBufferLength:6,backBufferLength:0});
  hls.loadSource(item.streamUrl);hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED,()=>{status.textContent="تم تحميل البث — اضغط ▶";});
  hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)status.textContent="تعذر تحميل البث. تحقق من الرابط وCORS."});
 }else if(video.canPlayType("application/vnd.apple.mpegurl")){
  video.src=item.streamUrl;video.load();
 }else status.textContent="المتصفح لا يدعم HLS";
}
function openYoutube(item){
 const id=youtubeId(item.streamUrl);
 if(!id){status.textContent="رابط YouTube غير صحيح";return}
 const iframe=document.createElement("iframe");
 iframe.className="youtubeFrame";iframe.allow="autoplay; encrypted-media; fullscreen; picture-in-picture";iframe.allowFullscreen=true;
 iframe.referrerPolicy="strict-origin-when-cross-origin";
 const origin=window.location.origin;
 const q=new URLSearchParams({autoplay:"0",playsinline:"1",rel:"0",enablejsapi:"1"});
 if(origin&&origin!=="null"&&origin.startsWith("http")){q.set("origin",origin);q.set("widget_referrer",origin)}
 iframe.src="https://www.youtube.com/embed/"+encodeURIComponent(id)+"?"+q.toString();
 shell.appendChild(iframe);
 shell.insertAdjacentHTML("afterend",'<div class="youtubeNote">مصدر YouTube — يعمل داخل الموقع حسب سماح الفيديو بالتضمين.</div>');
 status.textContent="اضغط ▶ داخل مشغل YouTube للتشغيل";
}
function openPlayer(item){
 destroyHls();shell.innerHTML="";document.querySelectorAll(".youtubeNote").forEach(x=>x.remove());
 title.textContent=item.name||"البث المباشر";modal.style.display="flex";document.body.style.overflow="hidden";
 status.textContent="جاري تجهيز المشغل...";
 if((item.type||"hls")==="youtube")openYoutube(item);else openHls(item);
}
function closePlayer(){
 destroyHls();modal.style.display="none";document.body.style.overflow="";shell.innerHTML="";video=null;
 document.querySelectorAll(".youtubeNote").forEach(x=>x.remove());
}
document.getElementById("close").onclick=closePlayer;
modal.onclick=e=>{if(e.target===modal)closePlayer()};
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement)try{screen.orientation?.unlock()}catch(e){}});

db.ref("streams").on("value",snap=>{
 const d=snap.val()||{},a=Object.entries(d).map(([id,v])=>({id,...v})).filter(x=>x.enabled!==false);
 a.sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));grid.innerHTML="";empty.style.display=a.length?"none":"block";
 a.forEach(x=>{
  const c=document.createElement("div");c.className="card";
  c.innerHTML=`<img class="thumb" src="${esc(x.image)}" alt=""><div class="body"><span class="live">● متاح الآن</span><div class="name">${esc(x.name)}</div><button class="watch">▶ شاهد الآن</button></div>`;
  c.querySelector(".watch").onclick=()=>openPlayer(x);grid.appendChild(c);
 });
});
</script></body></html>
